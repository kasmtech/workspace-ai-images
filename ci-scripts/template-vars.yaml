files: &UNIVERSAL_CHANGE_FILES
  - src/common/**
  - ci-scripts/**
  - .gitlab-ci.yml

multiImages:
  - name: claude-code
    singleapp: true
    base: core-ubuntu-jammy
    dockerfile: dockerfile-kasm-claude-code
