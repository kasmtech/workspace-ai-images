files: &UNIVERSAL_CHANGE_FILES
  - src/common/**
  - ci-scripts/**
  - .gitlab-ci.yml

multiImages: []

singleImages:
  - name: ubuntu-noble-anythingllm
    singleapp: false
    base: core-ubuntu-noble
    dockerfile: dockerfile-kasm-ubuntu-anythingllm
    changeFiles:
      - dockerfile-kasm-ubuntu-anythingllm
      - src/ubuntu/install/anythingllm/**
